description: >-
  Murphy USA (NYSE: MUSA) is a Fortune 500 retailer of gasoline and convenience
  merchandise, headquartered in El Dorado, Arkansas. The company operates roughly
  1,700 Murphy USA and Murphy Express stores across a 27-state footprint in the
  southern and midwestern United States, most of them sited in or adjacent to
  Walmart Supercenter parking lots, and it also owns the QuickChek chain of fresh
  convenience stores in New Jersey and New York. Its fuel slate spans E-10, E-15,
  FlexFuel (E85), ethanol-free E0, ULSD diesel, biodiesel and winterized diesel,
  marketed alongside a FuelAssure fuel-quality monitoring program. Consumer digital
  engagement runs through the Murphy Drive Rewards loyalty app and a Business Fuel
  Card program. Murphy USA publishes no public developer program, API reference or
  machine-readable contract.
