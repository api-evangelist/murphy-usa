# Negative probe result — recorded deliberately.
#
# roadmap#27: `llms_txt_published` credited a DECLARED pointer wherever no llms/
# artifact existed. This file IS that artifact. It makes repo_has?(slug,'llms')
# true so the unprobed-pointer fallback stops firing, while carrying no .txt so
# llms_txt_present? stays false. The check therefore returns a TRUE zero, backed
# by a fetched URL and a status code, instead of a false credit.
#
# Same posture as the well-known probe artifacts: a recorded absence is a valid
# measurement. Do not delete this to 'clean up' — deleting it restores the bug.
#
# 2026-08-28: the previous probe targeted murphy-usa.com, which is NOT a Murphy USA
# domain — it is a squatted holding page ("This Domain Is For Sale"). The dead
# LlmsText pointer to it has been removed from apis.yml and the probe re-run
# against the company's real host, murphyusa.com.
llms:
  probed: '2026-08-28'
  url: https://www.murphyusa.com/llms.txt
  status: 404
  verdict: not-published
  published: false
  detail: >-
    HTTP 404 from the Kentico CMS ("The resource you are looking for has been
    removed, had its name changed, or is temporarily unavailable.").
  also_probed:
    - url: https://murphyusa.com/llms.txt
      status: 404
    - url: https://corporate.murphyusa.com/llms.txt
      status: 404
    - url: https://www.murphydriverewards.com/llms.txt
      status: 404
  note: >-
    Murphy USA publishes no llms.txt on any host. No LLMsText pointer is claimed.
